services:
  - type: web
    name: safesteps-family-gps
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: safesteps-postgres
          property: connectionString
      - key: LOCATION_RETENTION_DAYS
        value: "30"
      - key: RATE_LIMIT_MAX
        value: "120"

databases:
  - name: safesteps-postgres
    plan: basic-256mb
