<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#eef3f8"/>
  <text x="70" y="72" font-family="Segoe UI, Arial" font-size="34" font-weight="800" fill="#142033">SafeSteps Android App Flow</text>
  <text x="70" y="106" font-family="Segoe UI, Arial" font-size="17" fill="#647286">Current APK starts with role choice, then guides parent or child through setup.</text>

  <g transform="translate(90 145)">
    <rect width="300" height="560" rx="34" fill="#172033"/>
    <rect x="18" y="28" width="264" height="504" rx="24" fill="#f4f7fb"/>
    <rect x="38" y="56" width="224" height="126" rx="10" fill="#102033"/>
    <text x="54" y="86" font-family="Segoe UI, Arial" font-size="11" font-weight="800" fill="#9ec5ff">FAMILY SAFETY SETUP</text>
    <text x="54" y="121" font-family="Segoe UI, Arial" font-size="24" font-weight="800" fill="#ffffff">SafeSteps</text>
    <text x="54" y="148" font-family="Segoe UI, Arial" font-size="24" font-weight="800" fill="#ffffff">Family GPS</text>
    <text x="54" y="168" font-family="Segoe UI, Arial" font-size="12" fill="#d8e3f2">Choose how this phone will be used.</text>
    <rect x="38" y="214" width="224" height="48" rx="8" fill="#2167d9"/>
    <text x="91" y="244" font-family="Segoe UI, Arial" font-size="15" font-weight="800" fill="#ffffff">I am the parent</text>
    <rect x="38" y="278" width="224" height="48" rx="8" fill="#ffffff" stroke="#c8d3e1"/>
    <text x="66" y="308" font-family="Segoe UI, Arial" font-size="15" font-weight="800" fill="#142033">This is the child's phone</text>
  </g>

  <g transform="translate(450 145)">
    <rect width="300" height="560" rx="34" fill="#172033"/>
    <rect x="18" y="28" width="264" height="504" rx="24" fill="#f4f7fb"/>
    <rect x="38" y="56" width="224" height="42" rx="8" fill="#ffffff" stroke="#c8d3e1"/>
    <text x="132" y="82" font-family="Segoe UI, Arial" font-size="14" font-weight="800" fill="#142033">Back</text>
    <rect x="38" y="116" width="224" height="270" rx="10" fill="#ffffff" stroke="#dce5ef"/>
    <text x="54" y="150" font-family="Segoe UI, Arial" font-size="20" font-weight="800" fill="#142033">Pair this phone</text>
    <text x="54" y="178" font-family="Segoe UI, Arial" font-size="12" fill="#647286">Enter the parent code and passkey.</text>
    <rect x="54" y="200" width="192" height="44" rx="8" fill="#f8fafd" stroke="#cad6e3"/>
    <text x="66" y="227" font-family="Segoe UI, Arial" font-size="13" fill="#6b7788">Server URL</text>
    <rect x="54" y="254" width="192" height="44" rx="8" fill="#f8fafd" stroke="#cad6e3"/>
    <text x="66" y="281" font-family="Segoe UI, Arial" font-size="13" fill="#6b7788">Child name</text>
    <rect x="54" y="308" width="90" height="44" rx="8" fill="#f8fafd" stroke="#cad6e3"/>
    <text x="66" y="335" font-family="Segoe UI, Arial" font-size="13" fill="#6b7788">Code</text>
    <rect x="156" y="308" width="90" height="44" rx="8" fill="#f8fafd" stroke="#cad6e3"/>
    <text x="168" y="335" font-family="Segoe UI, Arial" font-size="13" fill="#6b7788">Passkey</text>
    <rect x="54" y="366" width="192" height="48" rx="8" fill="#2167d9"/>
    <text x="96" y="396" font-family="Segoe UI, Arial" font-size="15" font-weight="800" fill="#ffffff">Pair with parent</text>
    <rect x="38" y="402" width="224" height="90" rx="10" fill="#ffffff" stroke="#dce5ef"/>
    <text x="54" y="434" font-family="Segoe UI, Arial" font-size="19" font-weight="800" fill="#142033">Permissions</text>
    <text x="54" y="460" font-family="Segoe UI, Arial" font-size="12" fill="#647286">Location, background tracking, notifications.</text>
  </g>

  <g transform="translate(810 145)">
    <rect width="300" height="560" rx="34" fill="#172033"/>
    <rect x="18" y="28" width="264" height="504" rx="24" fill="#f4f7fb"/>
    <rect x="38" y="56" width="224" height="44" rx="8" fill="#ffffff" stroke="#c8d3e1"/>
    <text x="132" y="84" font-family="Segoe UI, Arial" font-size="14" font-weight="800" fill="#142033">Back</text>
    <rect x="38" y="120" width="224" height="170" rx="10" fill="#ffffff" stroke="#dce5ef"/>
    <text x="54" y="154" font-family="Segoe UI, Arial" font-size="20" font-weight="800" fill="#142033">Parent setup</text>
    <text x="54" y="181" font-family="Segoe UI, Arial" font-size="12" fill="#647286">Open dashboard, add child, pair.</text>
    <rect x="54" y="204" width="192" height="44" rx="8" fill="#f8fafd" stroke="#cad6e3"/>
    <text x="66" y="231" font-family="Segoe UI, Arial" font-size="13" fill="#6b7788">SafeSteps server URL</text>
    <rect x="54" y="260" width="192" height="48" rx="8" fill="#2167d9"/>
    <text x="83" y="290" font-family="Segoe UI, Arial" font-size="15" font-weight="800" fill="#ffffff">Open parent dashboard</text>
    <rect x="38" y="330" width="224" height="130" rx="10" fill="#eaf1f8" stroke="#d5e2ef"/>
    <text x="54" y="365" font-family="Segoe UI, Arial" font-size="15" font-weight="800" fill="#142033">Parent role</text>
    <text x="54" y="392" font-family="Segoe UI, Arial" font-size="12" fill="#647286">Uses browser dashboard for pairing,</text>
    <text x="54" y="412" font-family="Segoe UI, Arial" font-size="12" fill="#647286">children, map, and route history.</text>
  </g>
</svg>
